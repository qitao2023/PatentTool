# =============================================
# Patent Tool 配置
# =============================================

# PDF提取
pdf:
  max_pages: 500
  ocr_enabled: false
  language: "chi_sim+eng"

# AI 引擎配置
ai:
  provider: "deepseek"                      # "deepseek" 或 "kimi"
  deepseek_model: "deepseek-v4-pro"       # 或 deepseek-v4-pro（旗舰）
  kimi_model: "kimi-k3"                     # 或 kimi-k2.6 / kimi-k2.7-code
  temperature: 0.4

# 检索式生成
query_generation:
  max_queries: 10
  max_tokens: 4096

# Web自动化
web:
  headless: true                  # 无头模式，后台静默运行
  viewport_width: 1920
  viewport_height: 1080
  locale: "zh-CN"
  timezone: "Asia/Shanghai"
  proxy: "http://127.0.0.1:7892"    # 代理地址（国内访问WIPO需要）

# PATENTSCOPE 配置
patentscope:
  base_url: "https://patentscope2.wipo.int"
  search_url: "https://patentscope2.wipo.int/search/zh/search.jsf"
  advanced_search_url: "https://patentscope2.wipo.int/search/zh/advancedSearch.jsf"
  detail_url_pattern: "https://patentscope2.wipo.int/search/zh/detail.jsf?docId={doc_id}"
  max_results_per_query: 200
  results_per_page: 200
  collections:
    - "PCT"
  rate_limit_calls_per_hour: 1000

  selectors:
    # 搜索页
    search_input: "#simpleSearchForm\\:fpSearch\\:input"
    search_button: "button[id*='fpSearch']"
    list_length_select: "select[id*='listLength']"

    # 结果页
    result_table: "table.patent-result-list"
    result_row: "tr.trans-result-list-row"
    patent_title: ".ps-patent-result--title--title"
    patent_number: ".ps-patent-result--title--patent-number"
    applicant: ".ps-patent-result--applicant"
    inventor: ".ps-patent-result--inventor"
    ipc: ".ps-patent-result--ipc"
    abstract_snippet: ".ps-patent-result--abstract"
    detail_link: "a[href*='detail']"
    next_page_link: "a[id*='nextPage'], a:has-text('Next')"
    results_count: ".results-count"

# HimmPat 配置（保留备用）
himmpat:
  base_url: "https://global.himmpat.com"
  search_url: "https://global.himmpat.com/intelligence?active=6"
  login_url: "https://global.himmpat.com/login"   # 会自动跳转到 rd.himmpat.com 完成登录
  login_mode: "auto"            # "manual" 或 "auto"
  max_results_per_query: 50
  results_per_page: 20            # 观察后调整

  # 元素选择器（观察HimmPat后调整）
  selectors:
    search_input: "textarea[placeholder*='技术'], [placeholder*='技术']"
    search_button: "button.search-btn"
    result_container: ".result-list"
    result_row: ".patent-item"
    patent_number: ".patent-number"
    title: ".patent-title"
    abstract: ".patent-abstract"
    applicant: ".patent-applicant"
    inventor: ".patent-inventor"
    pub_date: ".patent-date"
    ipc: ".patent-ipc"
    next_page: ".pagination-next"
    login_username: "input[name='username']"
    login_password: "input[type='password']"
    login_submit: "button[type='submit']"
    user_avatar: ".user-avatar, .user-info"

# 人类行为模拟
human:
  typing_delay_min_ms: 30
  typing_delay_max_ms: 150
  action_delay_mean_s: 1.5
  action_delay_std_s: 0.5
  search_interval_min_s: 8
  search_interval_max_s: 15
  long_pause_interval_queries: 3
  long_pause_min_s: 25
  long_pause_max_s: 40
  typo_probability: 0.02
  mouse_move_steps: 10

# 去重
dedup:
  title_similarity_threshold: 0.90
  primary_key: "publication_number"

# 分析
analysis:
  max_tokens: 8192
  top_n_for_detailed: 25
  batch_comparison: true

# Session
session:
  max_age_hours: 6
  profile_dir: "profiles/patentscope_browser"

# 输出
output:
  save_intermediate: true
  report_formats: ["json", "html"]
