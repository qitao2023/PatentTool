# =============================================
# Patent Tool 配置
# =============================================

# PDF提取
pdf:
  max_pages: 500
  ocr_enabled: false
  language: "chi_sim+eng"

# AI 引擎配置
ai:
  provider: "deepseek"                      # 默认提供商 "deepseek" 或 "kimi"
  deepseek_model: "deepseek-v4-flash"       # 默认模型
  kimi_model: "kimi-k3"                     # kimi-k3 / kimi-k2.6
  temperature: 0.4
  # 检索式生成可单独用不同提供商和模型
  query_provider: "deepseek"                    # 检索式专用提供商（不设则用 provider）
  query_model: "deepseek-v4-flash"                    # 检索式模型
  # 其他阶段模型
  screen_model: "deepseek-v4-flash"         # 筛选/评分（推荐快速模型）
  analysis_model: "deepseek-v4-flash"       # 对比分析

# 检索式生成
query_generation:
  max_queries: 20
  max_tokens: 8192
  max_description_chars: 5000      # 说明书截断长度（保留发明内容 + 实施方式前段）
  prompt_profile: "semiconductor"    # 提示词方案: "default" 或 "semiconductor"

# Web自动化
web:
  browser: "msedge"                # chrome / msedge / firefox
  use_cdp: false                    # true=连已有浏览器(需先开 --remote-debugging-port)
  cdp_port: 9222                    # CDP 远程调试端口
  viewport_width: 1920
  viewport_height: 1080
  locale: "zh-CN"
  timezone: "Asia/Shanghai"
  proxy: "http://127.0.0.1:7892"
  clash_api: "http://127.0.0.1:9090"  # Clash API（可选，遇403自动换节点）

# 检索参数（GUI 设置对话框可修改）
search:
  include_citations: true       # 从说明书提取引用专利号
  force_refresh: false          # 强制重新获取本申请
  stop_after: "download"            # 流程断点: abstracts | screen | download | score | full
  prefer_cn_family: true        # 优先使用中国同族专利：下载全文时若遇非CN专利，自动查专利族中的CN专利替换
  search_source: "google"            # 全链路引擎: wipo(搜索+下载走PATENTSCOPE) | google(搜索+下载走Google Patents)

# PATENTSCOPE 配置
patentscope:
  base_url: "https://patentscope2.wipo.int"
  search_url: "https://patentscope2.wipo.int/search/zh/search.jsf"
  advanced_search_url: "https://patentscope2.wipo.int/search/zh/advancedSearch.jsf"
  detail_url_pattern: "https://patentscope2.wipo.int/search/zh/detail.jsf?docId={doc_id}"
  max_results_per_query: 200
  results_per_page: 200
  collections:
    - "PCT"
  rate_limit_calls_per_hour: 1000

  selectors:
    # 搜索页
    search_input: "#simpleSearchForm\\:fpSearch\\:input"
    search_button: "button[id*='fpSearch']"
    list_length_select: "select[id*='listLength']"

    # 结果页
    result_table: "table.patent-result-list"
    result_row: "tr.trans-result-list-row"
    patent_title: ".ps-patent-result--title--title"
    patent_number: ".ps-patent-result--title--patent-number"
    applicant: ".ps-patent-result--applicant"
    inventor: ".ps-patent-result--inventor"
    ipc: ".ps-patent-result--ipc"
    abstract_snippet: ".ps-patent-result--abstract"
    detail_link: "a[href*='detail']"
    next_page_link: "a[id*='nextPage'], a:has-text('Next')"
    results_count: ".results-count"

# 人类行为模拟
human:
  typing_delay_min_ms: 30
  typing_delay_max_ms: 150
  action_delay_mean_s: 1.5
  action_delay_std_s: 0.5
  search_interval_min_s: 8
  search_interval_max_s: 15
  long_pause_interval_queries: 3
  long_pause_min_s: 25
  long_pause_max_s: 40
  typo_probability: 0.02
  mouse_move_steps: 10

# Google Patents（search_source=google 时生效，免浏览器）
google_patents:
  timeout: 20

# 去重
dedup:
  title_similarity_threshold: 0.90
  primary_key: "publication_number"

# 分析
analysis:
  max_tokens: 8192
  max_detail_fetch: 200       # 全文下载上限（超过则AI快速粗筛，~30秒）
  fulltext_batch_size: 30     # 全文筛选时每批发给AI的篇数
  max_chars_per_patent: 3000  # 全文筛选时每篇最多发给AI的字符数
  top_n_for_detailed: 10
  batch_comparison: true

# Session
session:
  max_age_hours: 6
  profile_dir: "profiles/patentscope_browser"

# 测试工具默认值（"设为默认值"按钮保存）
test:
  default_query: "掉电"
  default_count: 10
  batch_default_count: 200
  batch_default_concurrency: 1
  batch_default_queries: ['"H01L-29" AND ("high-k" OR "高誘電率") AND (gradient OR "composition gradient" OR "傾斜組成")', ("high-k" OR "高誘電率") AND (gradient OR "傾斜") AND ("interface trap" OR "界面欠陥" OR "界面準位"), ("nanosheet" OR "GAA" OR "nanowire" OR "ナノシート" OR "ゲートオールアラウンド") AND ("gate dielectric" OR "ゲート絶縁膜" OR "high-k") AND (gradient OR "傾斜組成"), ("H01L-29/51" OR "H01L-29/423") AND ("high-k" OR "高誘電率"), ("high-k" OR "高誘電率") AND (gradient OR "composition gradient" OR "傾斜組成"), ("GAA" OR "gate-all-around" OR "nanosheet") AND ("high-k" OR "高誘電率")]

# 输出
output:
  save_intermediate: true
  report_formats: ["json", "html"]
