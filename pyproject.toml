[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "patent-tool"
version = "1.0.0"
description = "专利检索分析桌面工具 - AI驱动专利对比分析与撰写"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.15",
    "anthropic>=0.39.0",
    "playwright>=1.48.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "markdown>=3.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
